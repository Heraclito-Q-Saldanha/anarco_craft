services:
  minecraft:
    image: itzg/minecraft-server
    ports:
      - "25565:25565/tcp"
      - "25575:25575/tcp"
    environment:
      EULA: "TRUE"
      TYPE: "FABRIC"
      VERSION: "26.3"
      ICON: /icon.png
      OVERRIDE_ICON: true
      ENABLE_RCON: "true"
      RCON_PORT: "25575"
    env_file:
      - path: .env
        required: true
    volumes:
      - minecraft:/data
      - ./data/mods:/mods:ro
      - ./data/config:/config:ro
      - ./data/icon.png:/icon.png:ro
    restart: unless-stopped

volumes:
  minecraft:
